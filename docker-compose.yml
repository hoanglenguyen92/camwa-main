# Infrastructure only. The backend runs on the host against localhost ports: make run.
name: camwa

services:
  app-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: camwa
      POSTGRES_USER: camwa
      POSTGRES_PASSWORD: "${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}"
    volumes: [app-db:/var/lib/postgresql/data]
    ports: ["${APP_DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camwa -d camwa"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak-db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: "${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env}"
    volumes: [keycloak-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: "${KC_DB_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:?set KC_BOOTSTRAP_ADMIN_USERNAME in .env}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env}"
      # Read by the ${...} placeholders in keycloak/realm-camwa.json on first import.
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET in .env}"
      SEED_ADMIN_ID: "${SEED_ADMIN_ID:?set SEED_ADMIN_ID in .env}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL in .env}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}"
      MAIL_SERVER: "${MAIL_SERVER:-}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_STARTTLS: "${MAIL_STARTTLS:-true}"
      MAIL_SSL_TLS: "${MAIL_SSL_TLS:-false}"
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
    depends_on:
      keycloak-db: {condition: service_healthy}
    healthcheck:
      # The image has no curl. Health is served on the management port 9000.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  app-db: {}
  keycloak-db: {}
