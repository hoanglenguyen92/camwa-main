name: Backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  api-client:
    name: OpenAPI and TypeScript client up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: make openapi PYTHON=python
      - name: Fail if the committed client is stale
        run: |
          git add -N frontend
          git diff --exit-code -- frontend/openapi.json frontend/src/generated \
            || { echo "::error::Run 'make openapi' and commit the result."; exit 1; }

  integration:
    name: Smoke test against Keycloak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: make env up seed-demo PYTHON=python
      - name: Start the backend
        run: nohup python -m uvicorn main:app --port 8000 > uvicorn.log 2>&1 &
      - run: python -m scripts.smoke_test
      - name: Backend and Keycloak logs
        if: failure()
        run: |
          cat uvicorn.log
          docker compose logs keycloak --tail 200
